
name: Update GitHub Profile

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v6


      # =========================
      # CREATE PROFILE FOLDER
      # =========================
      - name: Create profile folder
        run: mkdir -p profile


      # =========================
      # GET PROFILE INFORMATION
      # =========================
      - name: Get GitHub profile data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/seemalimran26 \
            -o profile/user.json


      # =========================
      # GENERATE FOLLOWERS /
      # FOLLOWING / REPOSITORIES
      # =========================
      - name: Generate profile information
        run: |
          python - <<'PY'
          import json

          with open("profile/user.json", "r", encoding="utf-8") as f:
              user = json.load(f)

          followers = user.get("followers", 0)
          following = user.get("following", 0)
          repositories = user.get("public_repos", 0)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="130"
          viewBox="0 0 900 130">

          <rect
            width="900"
            height="130"
            rx="16"
            fill="#0d1117"
            stroke="#30363d"/>

          <text
            x="70"
            y="45"
            font-family="Arial"
            font-size="18"
            fill="#8b949e">
            Followers
          </text>

          <text
            x="70"
            y="92"
            font-family="Arial"
            font-size="30"
            font-weight="bold"
            fill="#58a6ff">
            {followers}
          </text>

          <text
            x="350"
            y="45"
            font-family="Arial"
            font-size="18"
            fill="#8b949e">
            Following
          </text>

          <text
            x="350"
            y="92"
            font-family="Arial"
            font-size="30"
            font-weight="bold"
            fill="#58a6ff">
            {following}
          </text>

          <text
            x="620"
            y="45"
            font-family="Arial"
            font-size="18"
            fill="#8b949e">
            Public Repositories
          </text>

          <text
            x="620"
            y="92"
            font-family="Arial"
            font-size="30"
            font-weight="bold"
            fill="#58a6ff">
            {repositories}
          </text>

          </svg>'''

          with open("profile/github-profile.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY


      # =========================
      # GITHUB ANALYTICS
      # =========================
      - name: Generate GitHub Analytics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=seemalimran26&show_icons=true&hide_rank=false&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # =========================
      # TOP LANGUAGES
      # =========================
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=seemalimran26&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # =========================
      # CONTRIBUTION STREAK
      # =========================
      - name: Generate Contribution Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: username=seemalimran26&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # =========================
      # CLEAN TEMPORARY FILE
      # =========================
      - name: Remove temporary files
        run: rm -f profile/user.json


      # =========================
      # COMMIT GENERATED FILES
      # =========================
      - name: Save profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi

